name: Build and push frontend image

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ovc-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          # A release tag publishes :<version> and moves :latest; a manual run
          # from a branch only publishes :<sha>, leaving :latest on the release.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${{ env.IMAGE }}:${{ github.ref_name }}
          ${{ env.IMAGE }}:latest"
          else
            TAGS="${{ env.IMAGE }}:${{ github.sha }}"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
